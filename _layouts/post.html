---
layout: default
---

<article itemscope itemtype="http://schema.org/BlogPosting">
  <h2 itemprop="name headline">{{ page.title | escape }}{% if page.title_zh %}<span class="zh zh-line" lang="zh-CN">{{ page.title_zh | escape }}</span>{% endif %}</h2>
  <p class="post-meta text-muted">
    <time datetime="{{ page.date | date_to_xmlschema }}" itemprop="datePublished">{{ page.date | date: "%b %-d, %Y" }}<span class="zh" lang="zh-CN">{{ page.date | date: "%Y年%-m月%-d日" }}</span></time>
    {% if page.author %} &middot; <span itemprop="author">{{ page.author }}</span>{% endif %}
  </p>
  <div itemprop="articleBody">
    {{ content }}
  </div>
</article>
